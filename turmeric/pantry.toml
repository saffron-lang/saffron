[package]
name = "turmeric"
version = "0.1.0"
description = "Reactive web framework for Saffron targeting WASM"
type = "library"
entry = "src/index.sf"
authors = ["henry232323"]
target = "wasm32"

[dependencies]

[scripts]
build = "saffronc --target wasm32 src/index.sf build/turmeric.ll"
generate = "saffron run tools/generate_types.sf"

[scripts.bin]
sfx = "saffron run tools/sfx_transform.sf"
turmeric-build = "saffron run tools/build.sf"
turmeric-dev = "saffron run tools/build.sf --dev"
