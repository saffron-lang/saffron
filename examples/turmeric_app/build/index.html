<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Turmeric App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; }
        #app { min-height: 100vh; }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #3d3d55; }
        .logo { color: #ffb347; }
        .nav { display: flex; gap: 0.5rem; }
        .nav button { background: #2d2d44; color: #4fc3f7; border: 1px solid #4fc3f7; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .nav-link.active { background: #4fc3f7; color: #1a1a2e; }
        .content { padding: 2rem; max-width: 700px; margin: 0 auto; }
        .button-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .button-row button { background: #4fc3f7; color: #1a1a2e; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .danger { background: #ef5350 !important; color: white !important; }
        .app-footer { text-align: center; padding: 2rem; color: #666; font-size: 0.85rem; border-top: 1px solid #3d3d55; margin-top: 3rem; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
