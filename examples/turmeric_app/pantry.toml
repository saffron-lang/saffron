[package]
name = "turmeric-demo"
version = "0.1.0"
entry = "src/main.sf"
target = "wasm32"

[dependencies]
turmeric = { path = "../../turmeric" }

[scripts]
build = "saffronc --target wasm32 --lib-path .pantry/packages src/main.sf build/app.ll && wasm-link build/app.ll build/app.wasm"
dev = "saffronc --target wasm32 --lib-path .pantry/packages src/main.sf build/app.ll && wasm-link build/app.ll build/app.wasm && cd build && python3 -m http.server 8080"
